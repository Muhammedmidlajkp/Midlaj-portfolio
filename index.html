<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Muhammed Midlaj | MERN Stack Developer for India &amp; UAE</title>
    <meta name="description" content="Muhammed Midlaj is a MERN stack developer building websites and web apps for clients in India and the UAE. See live work built with React, Node.js and MongoDB." />
    <meta name="theme-color" content="#0a0a09" />
    <meta name="color-scheme" content="dark" />

    <!-- one brand mark: favicon.svg, generated PNGs and favicon.ico (scripts/make-icons.mjs) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- %VITE_SITE_URL% comes from .env (override it in Vercel when a custom
         domain is connected). sitemap.xml and robots.txt are generated at
         build time from the same value. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muhammed Midlaj" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Muhammed Midlaj | MERN Stack Developer for India &amp; UAE" />
    <meta property="og:description" content="Muhammed Midlaj is a MERN stack developer building websites and web apps for clients in India and the UAE. See live work built with React, Node.js and MongoDB." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Muhammed Midlaj, MERN Stack Developer. Websites and web apps for clients in India and the UAE, with screenshots of three projects." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muhammed Midlaj | MERN Stack Developer for India &amp; UAE" />
    <meta name="twitter:description" content="Muhammed Midlaj is a MERN stack developer building websites and web apps for clients in India and the UAE. See live work built with React, Node.js and MongoDB." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Muhammed Midlaj, MERN Stack Developer. Websites and web apps for clients in India and the UAE, with screenshots of three projects." />

    <!-- structured data (WebSite, Person, ProfilePage and one CreativeWork per
         project) is generated from src/data at build time by scripts/prerender.mjs -->
    <!--jsonld-->

    <!-- the page background paints before any CSS arrives; no light flash -->
    <style>html{background:#0a0a09}</style>

    <!-- repeat visitors in the same session skip the intro curtain. This tiny
         inline script is allowed by hash in the CSP (vercel.json); scripts/prerender.mjs
         fails the build if the hash no longer matches. -->
    <script>try{if(sessionStorage.getItem('midlaj-intro-seen')==='1')document.documentElement.classList.add('intro-seen')}catch(e){}</script>

    <!-- self-hosted fonts (see @font-face in src/index.css): the two used on the
         first screen, plus DM Mono for the clock -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-mono-latin-400-normal.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
